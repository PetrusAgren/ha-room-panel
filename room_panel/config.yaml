name: Room Panel
version: "0.1.2"
slug: room_panel
description: Room profiles and wall panel controls for Home Assistant
url: https://github.com/PetrusAgren/ha-room-panel
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
panel_admin: true
ingress: true
ingress_port: 8099
homeassistant_api: true
ports:
  8443/tcp: null
ports_description:
  8443/tcp: Optional direct HTTPS access
map:
  - type: ssl
    read_only: true
backup: cold
